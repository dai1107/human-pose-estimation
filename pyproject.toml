[build-system]
requires = ["setuptools>=75,<82", "wheel>=0.44,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "pose-estimation-hyrox"
dynamic = ["version"]
description = "Realtime pose estimation and HYROX movement analysis"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Pose Estimation Contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "mediapipe>=0.10.35,<0.11",
  "opencv-python>=4.10,<5.1",
  "numpy>=2.2,<2.3",
  "matplotlib>=3.10,<3.11",
  "Pillow>=10.4,<12",
  "Flask>=3.0,<3.2",
  "Flask-Sock>=0.7,<0.8",
  "simple-websocket>=1.0,<1.2",
  "wsproto>=1.2,<1.3",
  "h11>=0.14,<0.15",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.4,<8.5"]
rtmw-cpu = ["onnxruntime>=1.27,<1.28"]
rtmw-gpu = [
  "onnxruntime-gpu>=1.27,<1.28",
  "nvidia-cudnn-cu13>=9.24,<9.25",
]
dev = [
  "pytest>=7.4,<9",
  "build>=1.3,<2",
  "packaging>=24,<26",
  "tomli>=2.2,<3; python_version < '3.11'",
]

[project.scripts]
pose-estimation = "main:main"
pose-doctor = "src.doctor:main"
pose-web = "start_web:main"
pose-replay = "tools.replay_hyrox_video:main"
pose-golden = "tools.validate_golden_videos:main"
pose-endurance = "tools.run_endurance_test:main"
pose-latency-benchmark = "tools.pose_latency_benchmark:main"
pose-camera-benchmark = "tools.benchmark_camera_backends:main"
pose-baseline = "tools.run_baseline_regression:main"
pose-dataset-manifest = "tools.build_hyrox_dataset_manifest:main"
pose-oni-audit = "tools.audit_oni_dataset:main"
pose-oni-export = "tools.export_oni_dataset:main"
pose-oni-sync = "tools.synchronize_oni_dataset:main"
pose-phone-rgb-round6 = "tools.run_round6_phone_rgb:main"
pose-tracking-round7 = "tools.run_round7_tracking:main"
pose-cache-round8 = "tools.run_round8_pose_cache:main"
pose-shadow-round10 = "tools.run_round10_shadow:main"
pose-oni-research-round11 = "tools.run_round11_oni_research:main"
pose-angle-inspect = "tools.inspect_joint_angles:main"
pose-angle-annotate = "tools.manual_angle_annotation:main"
pose-angle-compare = "tools.compare_manual_angles:main"
pose-angle-analyze = "tools.analyze_existing_angle_errors:main"
pose-angle-v2-shadow = "tools.run_angle_v2_shadow:main"
pose-angle-v2-sweep = "tools.sweep_angle_v2_parameters:main"
pose-swim-wrist-track = "tools.run_swim_wrist_tracking:main"
pose-swim-round6 = "tools.run_swim_round6_experiment:main"
pose-clean = "src.output_management:main"
pose-occlusion-baseline = "tools.run_occlusion_view_baseline:main"
pose-occlusion-phase-cd = "tools.run_occlusion_view_phase_cd:main"
pose-reference-create = "src.tools.create_reference:main"
pose-reference-list = "src.tools.list_references:main"
pose-reference-inspect = "src.tools.inspect_session:main"
pose-reference-compare = "src.tools.compare_session:main"
pose-reference-export = "src.tools.export_reference:main"

[tool.setuptools.dynamic]
version = { attr = "src.version.__version__" }

[tool.setuptools]
include-package-data = true
py-modules = ["main", "start_web", "start_public_web"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hyrox*", "src*", "tools*", "webui*"]

[tool.setuptools.package-data]
webui = [
  "templates/*.html",
  "static/*.js",
  "static/*.css",
  "static/workers/*.js",
  "static/workers/*.mjs",
  "static/vendor/mediapipe/*.mjs",
  "static/vendor/mediapipe/wasm/*.js",
  "static/vendor/mediapipe/wasm/*.wasm",
]

[tool.setuptools.data-files]
"configs" = [
  "configs/product_pose.yaml",
  "configs/reference_features.yaml",
  "configs/reference_quality.yaml",
  "configs/hyrox_golden_videos.json",
  "configs/angle_v2_shadow.yaml",
  "configs/swim_wrist_tracking.yaml",
]
"configs/sample_pose_cache" = [
  "configs/sample_pose_cache/*.json.gz",
]
"configs/hyrox" = [
  "configs/hyrox/burpee_broad_jump.yaml",
  "configs/hyrox/contact.yaml",
  "configs/hyrox/farmers_carry.yaml",
  "configs/hyrox/foot_events.yaml",
  "configs/hyrox/lunge.yaml",
  "configs/hyrox/observability.yaml",
  "configs/hyrox/rowing.yaml",
  "configs/hyrox/skierg.yaml",
  "configs/hyrox/sled_pull.yaml",
  "configs/hyrox/sled_push.yaml",
  "configs/hyrox/wall_ball.yaml",
]
"configs/contracts" = [
  "configs/contracts/action_gating_v1.yaml",
  "configs/contracts/scoring_correction_v1.yaml",
  "configs/contracts/coordinate_spaces_v1.yaml",
  "configs/contracts/realtime_latency_v1.yaml",
  "configs/contracts/oni_research_v1.yaml",
  "configs/contracts/README.md",
]
"models" = [
  "models/pose_landmarker_lite.task",
  "models/pose_landmarker_full.task",
  "models/hand_landmarker.task",
  "models/README.md",
]
"." = ["yolo11n.pt", "yolo11n-pose.pt"]
