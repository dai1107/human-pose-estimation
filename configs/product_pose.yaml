product_pose:
  backend: mediapipe
  allow_experimental_backends: false
  realtime_model: auto
  analysis_model: full

pose:
  inference_width: 640
  adaptive_resolution: true

realtime_latency:
  latest_frame_only: true
  camera_buffer_size: 1
  queue_size: 1
  target_pose_fps: 15
  max_pose_fps: 20
  warning_pose_age_ms: 80
  analysis_max_pose_age_ms: 120
  display_prediction_ms: 45
  display_hold_ms: 250
  display_fade_ms: 150
  max_frame_gap: 5

analysis_smoothing:
  mode: adaptive_one_euro
  profile: responsive
  prediction_enabled: false
  max_gap_ms_before_reset: 250
  stable_min_cutoff: 0.8
  stable_beta: 0.025
  stable_d_cutoff: 1.0
  balanced_min_cutoff: 1.2
  balanced_beta: 0.05
  balanced_d_cutoff: 1.0
  responsive_min_cutoff: 1.7
  responsive_beta: 0.08
  responsive_d_cutoff: 1.0
  fast_joint_min_cutoff_scale: 1.25
  fast_joint_beta_scale: 1.50
  stable_joint_min_cutoff_scale: 0.75
  stable_joint_beta_scale: 0.50
  world_min_cutoff_scale: 0.90
  world_beta_scale: 0.85

display_smoothing:
  mode: adaptive_one_euro
  profile: ultra_responsive
  prediction_enabled: true
  max_gap_ms_before_reset: 250
  min_cutoff: 1.4
  beta: 0.08
  d_cutoff: 1.0
  raw_blend_enabled: true
  max_raw_weight: 0.10
  minimum_visibility: 0.70
  slow_speed: 0.15
  fast_speed: 1.20
  extremity_raw_weight_scale: 1.00
  core_raw_weight_scale: 0.35
  face_raw_weight_scale: 0.00
  world_speed_scale: 1.25
  landmark_enter_confidence: 0.50
  landmark_exit_confidence: 0.30
  landmark_hold_ms: 220
  pose_hold_frames: 5
  jitter_deadband: 0.0025
  quality_gate_enabled: true
  quality_minimum_confidence: 0.35
  quality_max_speed_body_s: 18.0
  quality_max_acceleration_body_s2: 180.0
  quality_max_bone_length_change_ratio: 0.55
  quality_identity_swap_margin: 0.12
  occlusion_short_prediction_ms: 200
  occlusion_hide_after_ms: 500
  occlusion_reacquire_frames: 3

display_prediction:
  enabled: true
  mode: constant_velocity
  max_horizon_ms: 45
  maximum_body_scale_displacement: 0.06
  minimum_visibility: 0.70
  velocity_decay: 0.85
  disable_after_gap_ms: 100
  reversal_strength: 0.25
  core_prediction_scale: 0.45
  face_prediction_scale: 0.0
  support_foot_horizontal_scale: 0.0

rendering:
  angle_text_fps: 12
  metrics_fps: 5
  stats_fps: 3
  timing_sample_capacity: 240

camera:
  preferred_width: 640
  preferred_height: 480
  preferred_fps: 60
  fallback_fps: 30
  diagnostic_sample_fps: 5
  low_light_luma: 55
  fps_warning_ratio: 0.80
  interval_anomaly_ratio: 1.80
  duplicate_warning_ratio: 0.20

local_first:
  web_pipeline: local_browser
  desktop_pipeline: local_device
  server_pose_fallback: true
  neural_prediction_enabled: false

three_d_kinematics:
  enabled: true
  decision_mode: assist
  assist_confidence_boost: 0.05
  assist_conflict_confidence_cap: 0.49

three_d_quality:
  min_visibility: 0.70
  min_presence: 0.70
  max_bone_length_change_ratio: 0.20
  max_angle_delta_deg: 35.0
  max_angular_velocity_deg_s: 720.0
  max_2d_3d_difference_deg: 25.0
  max_z_change_body_scale: 0.35
  identity_swap_cost_ratio: 0.75
  max_gap_ms_before_reset: 250
  bone_length_history_size: 31
  max_left_right_bone_ratio: 0.25
  max_landmark_speed_m_s: 5.0
  isolated_velocity_ratio: 3.0
  foot_stationary_speed_m_s: 0.35
  foot_vertical_spread_body_ratio: 0.18
  foot_contact_stable_frames: 3
  ground_history_size: 31
  ground_minimum_samples: 3
  ground_minimum_contact_confidence: 0.55
  ground_maximum_image_deviation: 0.025
  ground_maximum_world_vertical_deviation_m: 0.08
  contact_constraint_high_confidence: 0.70
  contact_constraint_drift_body_ratio: 0.10
  camera_motion_unstable_score: 0.42
  camera_motion_minimum_reliability: 0.35
  local_ground_minimum_confidence: 0.50
  biomech_minimum_confidence: 0.60
  pose_reliability_minimum_joint_confidence: 0.50
  validation_budget_ms: 4.0
  validation_maximum_stride: 4

web_realtime:
  max_requests_in_flight: 1
  inference_long_edge: 640
  jpeg_quality: 0.65

offline_fast:
  target_pose_fps: 15
  detailed_trace: false
  refinement_enabled: true
  refinement_pose_fps: 30
  candidate_margin_ms: 500
  minimum_source_frames: 30
