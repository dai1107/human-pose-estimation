name: CI

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install verified core and development dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Verify Python version contract
        run: python tools/ci_preflight.py --stage environment
      - name: Compile tracked Python and run static checks
        run: |
          python tools/ci_preflight.py --stage static
      - name: Unit tests
        run: python -m pytest -q
      - name: No-camera smoke test
        run: python -m src.smoke_test
      - name: Build and verify exactly one wheel and one source distribution
        run: |
          python -m build --no-isolation
          python tools/ci_preflight.py --stage package --dist-dir dist
